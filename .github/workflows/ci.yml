name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/two_agents_demo.py
      - run: python bench/compare.py
      - name: Canonical form of every example is stable
        run: |
          for f in examples/*.koine; do koine fmt "$f" > /dev/null; done
        shell: bash
