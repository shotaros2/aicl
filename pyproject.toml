[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koine-lang"
version = "0.1.0"
description = "Koine: a compact, unambiguous language for agent-to-agent communication (spec + reference implementation)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Koine contributors" }]
keywords = ["agents", "llm", "protocol", "interlingua", "multi-agent", "speech-acts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
llm = ["anthropic>=1.0"]
dev = ["pytest"]

[project.scripts]
koine = "koine.cli:main"

[project.urls]
Specification = "https://github.com/YOUR-ORG/koine/blob/main/SPEC.md"

[tool.setuptools]
packages = ["koine"]
