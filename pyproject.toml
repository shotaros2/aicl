[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicl-lang"
version = "0.3.0"
description = "AICL: a compact, unambiguous language for agent-to-agent communication (spec + reference implementation)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AICL contributors" }]
keywords = ["agents", "llm", "protocol", "interlingua", "multi-agent", "speech-acts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
crypto = ["cryptography>=42"]
llm = ["anthropic>=1.0", "google-genai>=1.0"]
mcp = ["mcp>=2.0", "google-genai>=1.0"]
dev = ["pytest"]

[project.scripts]
aicl = "aicl.cli:main"
aicl-mcp = "aicl.mcp_server:main"

[project.urls]
Homepage = "https://github.com/shotaros2/aicl"
Issues = "https://github.com/shotaros2/aicl/issues"
Specification = "https://github.com/shotaros2/aicl/blob/main/SPEC.md"

[tool.setuptools]
packages = ["aicl"]
